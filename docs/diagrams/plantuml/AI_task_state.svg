="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0018" data-source-line="30"><ellipse cx="569" cy="575.988" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="569" cy="575.988" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="36"><path d="M579.5,238.488 L579.5,285.488 L317.286,289.488 L579.5,293.488 L579.5,340.352 A0,0 0 0 0 579.5,340.352 L838.582,340.352 A0,0 0 0 0 838.582,340.352 L838.582,248.488 L828.582,238.488 L579.5,238.488 A0,0 0 0 0 579.5,238.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M828.582,238.488 L828.582,248.488 L838.582,248.488 L828.582,238.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="585.5" y="256.057" fill="#000" font-size="13" textLength="231.271">Внешний вызов вне транзакции БД.</text><text x="585.5" y="271.367" fill="#000" font-size="13" textLength="223.317">Timeout по умолчанию 30 секунд.</text><text x="585.5" y="286.678" fill="#000" font-size="13" textLength="231.245">Перед publish: владелец, согласие,</text><text x="585.5" y="301.988" fill="#000" font-size="13" textLength="238.082">status, lease/token, хеш и редакция.</text><text x="585.5" y="317.299" fill="#000" font-size="13" textLength="237.275">Старый token / просроченный ответ</text><text x="585.5" y="332.609" fill="#000" font-size="13" textLength="139.026">ничего не публикует.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="44"><path d="M114,425.488 L114,456.988 L96.063,460.988 L114,464.988 L114,496.73 A0,0 0 0 0 114,496.73 L400.148,496.73 A0,0 0 0 0 400.148,496.73 L400.148,435.488 L390.148,425.488 L114,425.488 A0,0 0 0 0 114,425.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M390.148,425.488 L390.148,435.488 L400.148,435.488 L390.148,425.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="120" y="443.057" fill="#000" font-size="13" textLength="264.31">ENTRY: immutable кандидаты, не факты.</text><text x="120" y="458.367" fill="#000" font-size="13" textLength="265.148">Человек подтверждает через tag-review.</text><text x="120" y="473.678" fill="#000" font-size="13" textLength="211.466">REPORT: READY + AI provenance;</text><text x="120" y="488.988" fill="#000" font-size="13" textLength="246.46">v1 выбирает/группирует allowedText.</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="50"><path d="M494,425.488 L494,456.988 L475.875,460.988 L494,464.988 L494,496.73 A0,0 0 0 0 494,496.73 L783.804,496.73 A0,0 0 0 0 783.804,496.73 L783.804,435.488 L773.804,425.488 L494,425.488 A0,0 0 0 0 494,425.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M773.804,425.488 L773.804,435.488 L783.804,435.488 L773.804,425.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="500" y="443.057" fill="#000" font-size="13" textLength="268.804">ENTRY: ручная разметка, текст сохранён.</text><text x="500" y="458.367" fill="#000" font-size="13" textLength="214.9">REPORT: если snapshot актуален,</text><text x="500" y="473.678" fill="#000" font-size="13" textLength="249.304">READY + TEMPLATE + причина отказа.</text><text x="500" y="488.988" fill="#000" font-size="13" textLength="264.907">Никакой фиктивной production-модели.</text></g><g class="entity" data-qualified-name="GMN32" id="ent0033" data-source-line="56"><path d="M720,533.488 L720,620.041 A0,0 0 0 0 720,620.041 L1152.296,620.041 A0,0 0 0 0 1152.296,620.041 L1152.296,543.488 L1142.296,533.488 L940,533.488 L936,481.069 L932,533.488 L720,533.488 A0,0 0 0 0 720,533.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1142.296,533.488 L1142.296,543.488 L1152.296,543.488 L1142.296,533.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="726" y="551.057" fill="#000" font-size="13" textLength="288.653">Для старой редакции результат в API скрыт.</text><text x="726" y="566.367" fill="#000" font-size="13" textLength="368.031">Терминальные задачи сохраняют историю до удаления.</text><text x="726" y="581.678" fill="#000" font-size="13" textLength="395.484">DELETE записи / отчёта / аккаунта удаляет задачу каскадно.</text><text x="726" y="596.988" fill="#000" font-size="13" textLength="411.296">После FAILED/CANCELLED новый запрос создаёт новую задачу,</text><text x="726" y="612.299" fill="#000" font-size="13" textLength="264.989">а не изменяет терминальный экземпляр.</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-link-type="dependency"><polygon points="746,128.247,750,119.247,746,123.247,742,119.247,746,128.247" fill="#3F5E66" style="stroke:#3F5E66;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M746,73.601 C746,87.461 746,106.384 746,123.247" style="stroke:#3F5E66;stroke-width:1;" fill="none"/><text x="748" y="106.057" fill="#000" font-size="13" textLength="291.402">Сохранённая редакция / снимок + согласие</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="285.919,269.254,292.694,262.105,287.588,264.541,285.153,259.435,285.919,269.254" fill="#3F5E66" style="stroke:#3F5E66;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M712.926,148.811 C627.984,147.645 404.523,148.384 343,186.488 C312.388,205.448 296.048,240.651 287.588,264.541" style="stroke:#3F5E66;stroke-width:1;" fill="none"/><text x="345.057" y="201.057" fill="#000" font-size="13" textLength="248.327">Lock владельца, свежесть; attempt++;</text><text x="345" y="216.367" fill="#000" font-size="13" textLength="248.441">lease = timeout + 30 сек, новый token</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk10" data-link-type="dependency"><polygon points="712.53,158.018,702.775,156.667,707.726,159.403,704.99,164.354,712.53,158.018"