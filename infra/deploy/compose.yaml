name: diary

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: diary
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: diary-backend:${BACKEND_TAG:?Set BACKEND_TAG in .env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/diary
      DB_USERNAME: diary
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-PT30S}
      LLM_NUM_CONTEXT: ${LLM_NUM_CONTEXT:-8192}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-4096}
      SPEECH_ENDPOINT: ${SPEECH_ENDPOINT:-}
      SPEECH_MODEL_ID: ${SPEECH_MODEL_ID:-}
      SPEECH_TOKEN: ${SPEECH_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
