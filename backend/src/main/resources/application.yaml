spring:
  application:
    name: diary-backend
  task:
    scheduling:
      pool:
        size: 3
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
      file-size-threshold: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/diary}
    username: ${DB_USERNAME:diary}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  security:
    issuer: https://diary.local
    audience: diary-mobile
    secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: PT15M
    refresh-ttl: P30D
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    auth-window: PT15M
    auth-max-attempts: 20
  ai-consent-version: diary-ai-v1
  ai:
    timeout: ${LLM_TIMEOUT:PT30S}
    ollama:
      endpoint: ${LLM_ENDPOINT:}
      model-id: ${LLM_MODEL_ID:}
      token: ${LLM_TOKEN:}
      num-context: ${LLM_NUM_CONTEXT:16384}
      num-predict: ${LLM_NUM_PREDICT:8192}
  speech:
    endpoint: ${SPEECH_ENDPOINT:}
    model-id: ${SPEECH_MODEL_ID:}
    token: ${SPEECH_TOKEN:}
    timeout: PT60S
    consent-version: diary-speech-v1
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: INFO
